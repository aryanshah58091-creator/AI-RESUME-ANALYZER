<!DOCTYPE html>
<html>

<head>
    <title>Test Jobs API</title>
</head>

<body>
    <h1>Testing Jobs API</h1>
    <div id="result"></div>

    <script>
        fetch('http://localhost/resume-api/api/jobs.php')
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerHTML = `
                    <h2>Success! Found ${data.length} jobs</h2>
                    <pre>${JSON.stringify(data.slice(0, 2), null, 2)}</pre>
                `;
            })
            .catch(error => {
                document.getElementById('result').innerHTML = `
                    <h2 style="color: red;">Error: ${error.message}</h2>
                `;
            });
    </script>
</body>

</html>
